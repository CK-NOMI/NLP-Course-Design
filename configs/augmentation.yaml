input_hard_file: data/hard_eval/hard_test.csv
output_file: data/augmented/augmented_samples.csv
filtered_output_file: data/augmented/augmented_samples_filtered.csv
target_per_type: 20
max_text_len: 256
min_text_len: 4
label_set: [0, 1]
random_seed: 42

llm:
  provider: openai_compatible
  model: gpt-4o-mini
  api_key_env: OPENAI_API_KEY
  base_url_env: OPENAI_BASE_URL
  temperature: 0.7
  max_tokens: 512
  dry_run: true
  samples_per_prompt: 3
