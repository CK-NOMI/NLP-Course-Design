seed: 42

data:
  train_file: data/processed/train.csv
  dev_file: data/processed/dev.csv
  test_file: data/processed/test.csv
  max_len: 256
  vocab_min_freq: 2
  vocab_path: outputs/vocab/char_vocab.json

model:
  name: bilstm
  embed_dim: 256
  hidden_dim: 128
  num_layers: 2
  dropout: 0.3
  num_classes: 2
  bidirectional: true

training:
  batch_size: 64
  epochs: 15
  lr: 0.001
  weight_decay: 0.0001
  patience: 3

output:
  checkpoint_dir: outputs/checkpoints
  log_dir: outputs/logs
  prediction_dir: outputs/predictions
  metrics_dir: outputs/metrics
